name: Daily job scrape

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install JobSpy
        run: pip install -U python-jobspy

      - name: Fetch placement updates
        run: python fetch_updates.py
        continue-on-error: true

      - name: Fetch business news
        run: python fetch_news.py
        continue-on-error: true

      - name: Run scraper
        run: python scraper.py
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}

      - name: Save results
        run: |
          git config user.name "jobs-bot"
          git config user.email "bot@example.com"
          git add *.json
          git commit -m "Daily update" || exit 0
          git pull --rebase origin main

          git push
