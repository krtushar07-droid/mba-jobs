name: Daily job scrape

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JobSpy
        run: pip install python-jobspy
        continue-on-error: true
      - name: Fetch placement updates
        run: python fetch_updates.py
        continue-on-error: true
      - name: Run scraper
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          USE_JOBSPY: "1"
        run: python scraper.py
      - name: Save results
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add *.json
          git diff --staged --quiet || git commit -m "Daily update"
          git push
