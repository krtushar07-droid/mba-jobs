<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Placement Hub Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
<style>
:root {
  --bg:#F8FAFC; --surface:#FFFFFF; --border:#E2E8F0; --text:#0F172A; --text-light:#475569;
  --primary:#0F172A; --accent:#2563EB; --success:#059669; --danger:#E11D48;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#0F172A; --surface:#1E293B; --border:#334155; --text:#F8FAFC; --text-light:#94A3B8; --primary:#FFFFFF; --accent:#3B82F6; --success:#10B981; }
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
body { margin:0; background:var(--bg); color:var(--text); padding-bottom:calc(80px + var(--safe-bottom)); }
header { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); padding:14px 20px; padding-top:calc(14px + env(safe-area-inset-top, 0px)); }
.brand h1 { font-size:20px; font-weight:700; margin:0; letter-spacing:-0.5px; color:var(--primary); }
.brand p { font-size:12px; font-weight:500; color:var(--success); margin:4px 0 0; }
.toolbar { padding:14px 20px; background:var(--surface); border-bottom:1px solid var(--border); }
.search-input { width:100%; padding:13px 16px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:16px; outline:none; }
.search-input:focus { border-color:var(--accent); }
.filters { display:flex; gap:10px; margin-top:12px; }
.filters select { flex:1; min-width:0; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; }
.stats { font-size:13px; font-weight:600; color:var(--text-light); padding:14px 20px 8px; }
main { max-width:800px; margin:0 auto; padding:0 16px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:14px; }
.job-title { font-size:17px; font-weight:700; margin:0 0 6px; color:var(--primary); line-height:1.3; overflow-wrap:anywhere; }
.company { font-size:14px; font-weight:600; color:var(--text-light); overflow-wrap:anywhere; }
.card-body { margin-top:12px; font-size:14px; line-height:1.6; color:var(--text-light); overflow-wrap:anywhere; }
.card-body a { color:var(--accent); }
.clamp { display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden; }
.more { margin-top:8px; background:none; border:none; color:var(--accent); font-size:14px; font-weight:600; padding:4px 0; cursor:pointer; }
.card-actions { display:flex; gap:10px; margin-top:16px; }
.btn { flex:1; padding:12px; border-radius:8px; font-size:14px; font-weight:600; text-align:center; text-decoration:none; cursor:pointer; border:none; }
.btn-primary { background:var(--accent); color:#FFF; }
.btn-secondary { background:var(--bg); border:1px solid var(--border); color:var(--text); }
.btn-whatsapp { background:#25D366; color:#FFF; display:flex; align-items:center; justify-content:center; gap:6px; }
.empty { text-align:center; color:var(--text-light); padding:40px 20px; font-size:14px; line-height:1.6; }
.empty.error { color:var(--danger); }
.dashboard-menu { display:none; }
.menu-item { display:flex; justify-content:space-between; align-items:center; padding:16px; background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:12px; font-weight:600; }
.menu-item small { font-weight:500; color:var(--text-light); }
#installAppBox { display:none; border-color:var(--accent); color:var(--accent); cursor:pointer; }
.bottom-nav { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); display:flex; padding-bottom:var(--safe-bottom); }
.nav-btn { flex:1; padding:10px 0; border:none; background:transparent; color:var(--text-light); font-size:11px; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; }
.nav-btn.active { color:var(--accent); }
.nav-btn svg { width:22px; height:22px; stroke:currentColor; stroke-width:2; fill:none; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Placement Hub</h1>
    <p id="syncStatus">Loading…</p>
  </div>
</header>

<div class="toolbar" id="mainToolbar">
  <input type="search" id="search" class="search-input" placeholder="Search jobs..." autocomplete="off">
  <div class="filters" id="jobFilters">
    <select id="filterSector"><option value="">All Sectors</option></select>
    <select id="filterCompany"><option value="">All Companies</option></select>
  </div>
</div>

<div class="stats" id="statsCount">Loading…</div>

<main>
  <div id="listContainer"></div>
  <div class="dashboard-menu" id="dashboardMenu">
    <div class="menu-item" id="installAppBox"><span>Install mobile app</span><span>→</span></div>
    <div class="menu-item"><span>Jobs</span><small id="dJobs">–</small></div>
    <div class="menu-item"><span>Campus notices</span><small id="dNotices">–</small></div>
    <div class="menu-item"><span>Business news</span><small id="dNews">–</small></div>
    <div class="menu-item"><span>Latest notice</span><small id="dLatest">–</small></div>
  </div>
</main>

<nav class="bottom-nav">
  <button class="nav-btn active" id="tab-jobs" data-tab="jobs">
    <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>Jobs
  </button>
  <button class="nav-btn" id="tab-notices" data-tab="notices">
    <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>Notices
  </button>
  <button class="nav-btn" id="tab-news" data-tab="news">
    <svg viewBox="0 0 24 24"><path d="M19 20H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h10l6 6v10a2 2 0 0 1-2 2z"></path><path d="M14 2v7h7"></path><path d="M8 12h8"></path><path d="M8 16h8"></path></svg>News
  </button>
  <button class="nav-btn" id="tab-dashboard" data-tab="dashboard">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>Dashboard
  </button>
</nav>

<script>
const $ = id => document.getElementById(id);
let jobsData = [], noticesData = [], newsData = [], currentTab = 'jobs';
const failed = {};
let visibleJobs = [];
let limit = 30, total = 0;

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
const toList = (v, key) => Array.isArray(v) ? v : (v && (v[key] || v.items)) || [];
const fmtDate = d => { const t = new Date(d); return isNaN(t) ? '' : t.toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'}); };
const linkify = html => html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

function getJson(url) {
  return fetch(url + '?v=' + Date.now(), { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
}

function init() {
  Promise.allSettled([getJson('jobs.json'), getJson('updates.json'), getJson('news.json')])
    .then(([j, n, w]) => {
      if (j.status === 'fulfilled') { jobsData = toList(j.value, 'jobs'); populateFilters(); } else failed.jobs = true;
      if (n.status === 'fulfilled') {
        noticesData = toList(n.value, 'items').map(x => ({
          title: x.title || x.subject || 'Notice',
          body: x.body || x.text || x.snippet || x.content || '',
          sent: x.sent || x.date || x.time || ''
        })).sort((a, b) => (new Date(b.sent) || 0) - (new Date(a.sent) || 0));
        const stamp = n.value && (n.value.updated || n.value.generated || n.value.fetched);
        $('syncStatus').textContent = stamp ? 'Notices updated ' + fmtDate(stamp) : 'Connected';
      } else { failed.notices = true; $('syncStatus').textContent = 'Notices unavailable'; }
      if (w.status === 'fulfilled') newsData = toList(w.value, 'items'); else failed.news = true;
      render();
    });
}

function populateFilters() {
  const s = $('filterSector'), c = $('filterCompany');
  [...new Set(jobsData.map(j => j.sector))].filter(Boolean).sort().forEach(v => s.add(new Option(v, v)));
  [...new Set(jobsData.map(j => j.company))].filter(Boolean).sort().forEach(v => c.add(new Option(v, v)));
}

function setTab(tab) {
  currentTab = tab;
  ['jobs', 'notices', 'news', 'dashboard'].forEach(t => $('tab-' + t).classList.toggle('active', t === tab));
  $('mainToolbar').style.display = tab === 'dashboard' ? 'none' : 'block';
  $('jobFilters').style.display = tab === 'jobs' ? 'flex' : 'none';
  $('dashboardMenu').style.display = tab === 'dashboard' ? 'block' : 'none';
  $('listContainer').style.display = tab === 'dashboard' ? 'none' : 'block';
  $('search').placeholder = { jobs:'Search jobs...', notices:'Search campus emails...', news:'Search business news...' }[tab] || '';
  limit = 30;
  window.scrollTo(0, 0);
  render();
}

function emptyMsg(text, isError) { return `<div class="empty${isError ? ' error' : ''}">${text}</div>`; }

function render() {
  const stats = $('statsCount'), c = $('listContainer');
  if (currentTab === 'dashboard') {
    stats.style.display = 'none';
    $('dJobs').textContent = jobsData.length;
    $('dNotices').textContent = noticesData.length;
    $('dNews').textContent = newsData.length;
    $('dLatest').textContent = noticesData[0] ? fmtDate(noticesData[0].sent) : '–';
    return;
  }
  stats.style.display = 'block';
  const q = $('search').value.trim().toLowerCase();
  let html = '';

  if (currentTab === 'jobs') {
    const sec = $('filterSector').value, cmp = $('filterCompany').value;
    visibleJobs = jobsData.filter(j => (!sec || j.sector === sec) && (!cmp || j.company === cmp) &&
      (!q || ((j.title || '') + ' ' + (j.company || '')).toLowerCase().includes(q)));
    stats.textContent = `${visibleJobs.length} active openings`;
    if (failed.jobs) html = emptyMsg('Could not load jobs.json. Check that the file exists in the repo.', true);
    else if (!visibleJobs.length) html = emptyMsg('No jobs match your search.');
    total = visibleJobs.length;
    visibleJobs.slice(0, limit).forEach((j, i) => {
      const url = safeUrl(j.url);
      html += `<div class="card">
        <h2 class="job-title">${esc(j.title)}</h2>
        <div class="company">${esc(j.company)}${j.location ? ' · ' + esc(j.location) : ''}</div>
        <div class="card-actions">
          ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener" class="btn btn-primary">Apply now</a>` : ''}
          <button class="btn btn-whatsapp" data-share="${i}">Share on WhatsApp</button>
        </div></div>`;
    });
  } else if (currentTab === 'notices') {
    const f = noticesData.filter(n => !q || (n.title + ' ' + n.body).toLowerCase().includes(q));
    stats.textContent = `${f.length} campus notices`;
    if (failed.notices) html = emptyMsg('Could not load updates.json. Run the GitHub workflow and check that the file is in the repo root.', true);
    else if (!f.length) html = emptyMsg('No notices found.');
    total = f.length;
    f.slice(0, limit).forEach(n => {
      const long = n.body.length > 350;
      html += `<div class="card">
        <h2 class="job-title">${esc(n.title)}</h2>
        <div class="company">${fmtDate(n.sent)}</div>
        <div class="card-body${long ? ' clamp' : ''}">${linkify(esc(n.body)).replace(/\n/g, '<br>')}</div>
        ${long ? '<button class="more">Read more</button>' : ''}</div>`;
    });
  } else if (currentTab === 'news') {
    const f = newsData.filter(n => !q || ((n.title || '') + ' ' + (n.source || '')).toLowerCase().includes(q));
    stats.textContent = 'Latest business updates';
    if (failed.news) html = emptyMsg('News is unavailable right now.', true);
    else if (!f.length) html = emptyMsg('No news found.');
    f.forEach(n => {
      const url = safeUrl(n.url);
      html += `<div class="card">
        <h2 class="job-title" style="font-size:16px">${esc(n.title)}</h2>
        <div class="company">${esc(n.source)} ${esc(n.date || n.published || '')}</div>
        ${url ? `<div class="card-actions"><a href="${esc(url)}" target="_blank" rel="noopener" class="btn btn-secondary">Read article</a></div>` : ''}</div>`;
    });
  }
  if ((currentTab === 'jobs' || currentTab === 'notices') && total > limit)
    html += `<button class="btn btn-secondary" style="width:100%;margin-bottom:16px" data-more="1">Show more (${total - limit} left)</button>`;
  c.innerHTML = html;
}

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) return setTab(tab.dataset.tab);
  const share = e.target.closest('[data-share]');
  if (share) {
    const j = visibleJobs[+share.dataset.share]; if (!j) return;
    const url = safeUrl(j.url);
    const text = `Hey, check out this opening for ${j.title} at ${j.company}!${url ? ' Apply here: ' + url : ''}`;
    window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(text), '_blank');
    return;
  }
  if (e.target.closest('[data-more]')) { limit += 30; return render(); }
  const more = e.target.closest('.more');
  if (more) {
    const body = more.previousElementSibling, open = body.classList.toggle('clamp');
    more.textContent = open ? 'Read more' : 'Show less';
  }
});

['search', 'filterSector', 'filterCompany'].forEach(id => $(id).addEventListener('input', () => { limit = 30; render(); }));

let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e; $('installAppBox').style.display = 'flex';
});
$('installAppBox').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') $('installAppBox').style.display = 'none';
  deferredPrompt = null;
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
init();
</script>
</body>
</html>
