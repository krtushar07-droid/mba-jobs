<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Placement Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1428" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F8;--card:#fff;--line:#E3E8F0;--ink:#131B3A;--mute:#66708A;--navy:#18264F;--blue:#3556B5;--chip:#EEF1FB;--warn-bg:#FEF0DC;--warn:#9A5B0B;--ok-bg:#E6F5EC;--ok:#1F6B43;--dot:#E0983C;--sb:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0E1428;--card:#17203B;--line:#2A3558;--ink:#F1F4FB;--mute:#9AA6C4;--navy:#4B6BD6;--blue:#8FA8F5;--chip:#223059;--warn-bg:#3A2A12;--warn:#F2B866;--ok-bg:#12332A;--ok:#6FD3A0}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + var(--sb))}
button,input,select{font:inherit;color:inherit}
svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;font-weight:600;font-size:17px}
.mark{width:40px;height:40px;border-radius:12px;background:var(--chip);color:var(--blue);display:grid;place-items:center}
.hbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;position:relative;cursor:pointer}
.hbtn.dot::after{content:"";position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--dot)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--chip);color:var(--navy);font-weight:600;font-size:14px;border:0;cursor:pointer}
#pop{position:fixed;left:16px;right:16px;top:calc(76px + env(safe-area-inset-top,0px));z-index:60;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 32px rgba(15,23,60,.16);display:none}
#pop.show{display:block}
main{max-width:720px;margin:0 auto;padding:22px 18px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--blue)}
h1{font:700 34px/1.1 "Source Serif 4",Georgia,serif;letter-spacing:-.5px;margin:10px 0 8px}
h2{font:700 24px/1.2 "Source Serif 4",Georgia,serif;margin:26px 0 12px}
h3{font-size:17px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.sub{color:var(--mute)}.meta{color:var(--mute);font-size:14px;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;font-size:12px;color:var(--mute);margin-top:12px}
.pill i{width:7px;height:7px;border-radius:50%;background:#2FA36B}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.row{display:flex;align-items:flex-start;gap:12px}.grow{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;cursor:pointer}
.stat small{display:block;color:var(--mute);font-size:13px}
.stat div{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.stat b{font-size:34px;font-weight:600;line-height:1}
.tag{display:inline-block;background:var(--chip);color:var(--blue);border-radius:10px;padding:4px 12px;font-size:13px;font-weight:600}
.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}.tags .tag{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:500}
.tags .tag.hot{background:var(--chip);color:var(--blue);border-color:transparent}
.logo{width:48px;height:48px;border-radius:14px;background:var(--chip);color:var(--navy);font-weight:700;font-size:20px;display:grid;place-items:center;flex:none}
.loc{margin-top:12px}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font-weight:600;text-align:center;text-decoration:none;cursor:pointer;display:block}
.btn.pri{background:var(--navy);color:#fff}.btn.sec{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.icon{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.icon.on{color:var(--blue)}.icon.on svg{fill:currentColor}
.link{background:none;border:0;color:var(--blue);font-weight:600;padding:6px 0;margin-top:10px;cursor:pointer}
.field{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0 16px;margin:18px 0 12px}
.field:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(53,86,181,.25)}
.field input{flex:1;border:0;background:none;padding:16px 0;outline:none;font-size:16px;min-width:0}
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip,.chips select{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 16px;font-weight:600;white-space:nowrap;cursor:pointer;max-width:200px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sum{color:var(--mute);margin-top:8px}.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.body{margin-top:12px;color:var(--mute);overflow-wrap:anywhere}.body a{color:var(--blue)}
.thumb{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;border-radius:14px;overflow:hidden;cursor:pointer;margin-bottom:14px;background:linear-gradient(135deg,hsl(var(--h) 55% 88%),hsl(var(--h) 55% 76%))}
div.thumb{cursor:default}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font:700 54px "Source Serif 4",Georgia,serif;color:hsl(var(--h) 45% 32%)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .tap{position:absolute;left:10px;bottom:10px;background:rgba(15,23,60,.78);color:#fff;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600}
.empty{text-align:center;padding:36px 18px;color:var(--mute)}.empty b{display:block;color:var(--ink);font-size:17px;margin:8px 0 4px}.empty.err{color:#C0304F}
.empty .btn{display:inline-block;flex:none;margin-top:16px;padding:14px 26px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:var(--sb);z-index:50}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:10px 0;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
nav button.on{color:var(--ink)}nav button.on svg{stroke-width:2.4}
#sheet{position:fixed;inset:0;z-index:80;background:rgba(10,16,40,.55);display:none;align-items:flex-end;justify-content:center}
#sheet.show{display:flex}
.panel{background:var(--card);width:100%;max-width:720px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + var(--sb))}
.panel .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.panel p{margin:12px 0 18px;line-height:1.7}
@media(prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="mark"><svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.5"/><path d="M6 16.5V9a3 3 0 1 1 3 3h6a3 3 0 1 1 0 6h-3"/></svg></div>Placement Hub</div>
  <button class="hbtn" data-go="jobs" data-focus="1" aria-label="Search jobs"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  <button class="hbtn" id="bell" data-pop="bell" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
  <button class="avatar" id="av" data-pop="me" aria-label="Profile"></button>
</header>
<div id="pop"></div>
<main id="app"></main>
<nav id="nav"></nav>
<div id="sheet"></div>

<script>
const $=id=>document.getElementById(id);
const svg=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const ic={
 home:svg('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'),
 jobs:svg('<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>'),
 updates:svg('<path d="M3 10v4h4l6 4V6l-6 4z"/><path d="M16 9a4 4 0 0 1 0 6"/>'),
 news:svg('<path d="M4 4h13v16H6a2 2 0 0 1-2-2z"/><path d="M17 8h3v10a2 2 0 0 1-2 2"/><path d="M8 8h5M8 12h5M8 16h5"/>'),
 saved:svg('<path d="M6 3h12v18l-6-4-6 4z"/>'),
 share:svg('<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>'),
 user:svg('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
 x:svg('<path d="M18 6 6 18M6 6l12 12"/>')
};
const TABS=[['home','Home'],['jobs','Jobs'],['updates','Updates'],['news','News'],['saved','Saved']];
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const USER=Object.assign({name:''},load('ph_user',{}));
const initials=n=>n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'?';
const S={tab:'home',jobs:[],notices:[],news:[],failed:{},ready:false,q:'',sector:'',company:'',cat:'All',limit:30,open:{},updated:'',saved:load('ph_saved',[]),hideInstall:false};
let dp=null;

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s||'').replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const list=(v,k)=>Array.isArray(v)?v:(v&&(v[k]||v.items))||[];
const fmt=d=>{const t=new Date(d);return isNaN(t)?'':t.toLocaleDateString(undefined,{day:'numeric',month:'short'})};
const days=d=>Math.floor((new Date().setHours(0,0,0,0)-new Date(d).setHours(0,0,0,0))/864e5);
const since=d=>{if(!d||isNaN(new Date(d)))return'Recently';const n=days(d);return n<=0?'Posted today':n===1?'Posted yesterday':`Posted ${n} days ago`};
const ago=d=>{const t=new Date(d);if(isNaN(t))return'';const m=(Date.now()-t)/6e4;if(m<60)return Math.max(1,Math.round(m))+'m ago';if(m<1440)return Math.round(m/60)+'h ago';const n=Math.floor(m/1440);return n===1?'Yesterday':n<7?n+' days ago':fmt(t)};
const hue=s=>{let h=0;for(const c of String(s||'n'))h=(h*31+c.charCodeAt(0))%360;return h};
const linkify=h=>h.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
const getJson=u=>fetch(u+'?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()});

function init(){
 Promise.allSettled([getJson('jobs.json'),getJson('updates.json'),getJson('news.json')]).then(([j,n,w])=>{
  if(j.status==='fulfilled'){S.jobs=list(j.value,'jobs');S.updated=j.value.updated||''}else S.failed.jobs=1;
  if(n.status==='fulfilled')S.notices=list(n.value,'items').map(x=>({title:x.title||x.subject||'Notice',body:x.body||x.text||x.snippet||x.content||'',sent:x.sent||x.date||x.time||''})).sort((a,b)=>(new Date(b.sent)||0)-(new Date(a.sent)||0));else S.failed.notices=1;
  if(w.status==='fulfilled')S.news=list(w.value,'items');else S.failed.news=1;
  S.ready=true;
  if(S.notices.some(x=>Date.now()-new Date(x.sent)<3*864e5))$('bell').classList.add('dot');
  render();
 });
}

const tagFor=n=>{const t=(n.title+' '+n.body).toLowerCase();
 if(/shortlist/.test(t))return['Shortlisted','ok'];
 if(/deadline|last date|apply|register|submit/.test(t))return['Action required','warn'];
 if(Date.now()-new Date(n.sent)<2*864e5)return['New',''];return null};
const tagHtml=n=>{const t=tagFor(n);return t?`<span class="tag ${t[1]}">${t[0]}</span>`:''};
const empty=(t,e)=>`<div class="empty${e?' err':''}">${t}</div>`;

function jobCard(j){
 const url=safeUrl(j.url),on=S.saved.includes(j.id);
 return `<div class="card"><div class="row"><div class="logo">${esc((j.company||'?')[0])}</div><div class="grow"><div class="meta">${esc(j.company)} · ${since(j.first_seen)}</div><h3>${esc(j.title)}</h3></div><button class="icon${on?' on':''}" data-save="${esc(j.id)}" aria-label="${on?'Remove from saved':'Save job'}">${ic.saved}</button></div>
 <div class="meta loc">${esc(j.location||'India')}</div>
 <div class="tags">${j.sector?`<span class="tag">${esc(j.sector)}</span>`:''}${j.new?'<span class="tag hot">New</span>':''}</div>
 <div class="actions">${url?`<a class="btn pri" href="${esc(url)}" target="_blank" rel="noopener">Apply now</a>`:'<span class="grow"></span>'}<button class="icon" data-share="${esc(j.id)}" aria-label="Share">${ic.share}</button></div></div>`;
}

function thumb(n,i,tap){
 const img=safeUrl(n.image||n.img||n.thumbnail||n.urlToImage||n.image_url);
 const inner=`<span class="ph">${esc((n.source||n.title||'N')[0])}</span>${img?`<img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:''}${tap?'<span class="tap">Tap for summary</span>':''}`;
 const st=`style="--h:${hue(n.category||n.source)}"`;
 return tap?`<button class="thumb" ${st} data-news="${i}" aria-label="Read summary: ${esc(n.title)}">${inner}</button>`:`<div class="thumb" ${st}>${inner}</div>`;
}
const newsSummary=n=>strip(n.summary||n.description||n.snippet||n.content);

function vHome(){
 const nw=S.jobs.filter(j=>j.new).length,rec=S.notices.filter(x=>Date.now()-new Date(x.sent)<3*864e5).length,cos=new Set(S.jobs.map(j=>j.company)).size;
 const h=new Date().getHours(),g=h<12?'Good morning':h<17?'Good afternoon':'Good evening',n=S.notices[0];
 const stat=(l,v,b,go)=>`<button class="stat" data-go="${go}"><small>${l}</small><div><b>${v}</b><span class="tag">${b}</span></div></button>`;
 return `<div class="eyebrow">Your placement desk</div><h1>${g}${USER.name?', '+esc(USER.name.split(' ')[0]):''}</h1><p class="sub">Everything you need for placements, in one place.</p>${USER.name?'':'<button class="link" data-pop="me">Add your name</button>'}
 ${S.updated?`<span class="pill"><i></i>Updated ${fmt(S.updated)}</span>`:''}
 <div class="grid">${stat('New jobs',nw,'+'+nw+' today','jobs')}${stat('Campus updates',S.notices.length,rec+' recent','updates')}${stat('Companies',cos,'hiring','jobs')}${stat('Saved jobs',S.saved.length,'view','saved')}</div>
 ${n?`<div class="card"><div class="row"><h3 class="grow">Latest from campus</h3>${tagHtml(n)}</div><p class="meta" style="margin-top:10px"><b style="color:var(--ink)">${esc(n.title)}</b></p><p class="sum clamp">${esc(strip(n.body))}</p><button class="link" data-go="updates">Read notice →</button></div>`:''}
 <h2>Recommended for you</h2>${S.jobs.slice(0,2).map(jobCard).join('')||empty('No jobs yet.')}<button class="btn sec" data-go="jobs" style="margin-bottom:14px">View all jobs</button>
 ${dp&&!S.hideInstall?`<div class="card"><h3>Install Placement Hub</h3><p class="sub">Faster access and daily refreshes.</p><div class="actions"><button class="btn pri" data-install="1">Install app</button><button class="btn sec" data-hide="1">Not now</button></div></div>`:''}`;
}

function vJobs(){
 const q=S.q.trim().toLowerCase();
 const f=S.jobs.filter(j=>(!S.sector||j.sector===S.sector)&&(!S.company||j.company===S.company)&&(!q||((j.title||'')+' '+(j.company||'')+' '+(j.location||'')).toLowerCase().includes(q)));
 const opts=(k,cur,all)=>`<option value="">${all}</option>`+[...new Set(S.jobs.map(j=>j[k]))].filter(Boolean).sort().map(v=>`<option${v===cur?' selected':''} value="${esc(v)}">${esc(v)}</option>`).join('');
 return `<div class="eyebrow">Opportunities</div><h1>Find your next move.</h1><p class="sub">Fresh openings curated for MBA students.</p>
 <label class="field">${svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>')}<input id="q" type="search" placeholder="Search roles, companies, skills" value="${esc(S.q)}" autocomplete="off"></label>
 <div class="chips"><select id="fs" aria-label="Sector">${opts('sector',S.sector,'Sector: All')}</select><select id="fc" aria-label="Company">${opts('company',S.company,'Company: All')}</select></div>
 <p class="meta" style="margin:12px 0">${f.length} active openings</p>
 ${S.failed.jobs?empty('Could not load jobs.json.',1):!f.length?empty('No jobs match your search.'):''}
 ${f.slice(0,S.limit).map(jobCard).join('')}${f.length>S.limit?`<button class="btn sec" data-more="1">Show more (${f.length-S.limit} left)</button>`:''}`;
}

function vUpdates(){
 return `<div class="eyebrow">From the placement cell</div><h1>Campus updates</h1><p class="sub">The notices worth opening first.</p><div style="height:18px"></div>
 ${S.failed.notices?empty('Could not load updates.json. Run the GitHub workflow and check the file is in the repo root.',1):!S.notices.length?empty('No notices yet.'):''}
 ${S.notices.slice(0,S.limit).map((n,i)=>{const o=S.open[i],long=n.body.length>180;
  return `<div class="card"><div class="row"><span class="grow" style="color:var(--blue);font-weight:600">Placement Cell · ${fmt(n.sent)}</span>${tagHtml(n)}</div><h3 style="margin-top:14px">${esc(n.title)}</h3>
  ${o?`<div class="body">${linkify(esc(n.body)).replace(/\n/g,'<br>')}</div>`:`<p class="sum clamp">${esc(strip(n.body))}</p>`}
  ${long||o?`<button class="link" data-notice="${i}">${o?'Hide notice ▴':'Read notice ▾'}</button>`:''}</div>`}).join('')}
 ${S.notices.length>S.limit?`<button class="btn sec" data-more="1">Show more (${S.notices.length-S.limit} left)</button>`:''}`;
}

function vNews(){
 const cats=['All',...new Set(S.news.map(n=>n.category||n.topic).filter(Boolean))];
 const f=S.news.map((n,i)=>({n,i})).filter(x=>S.cat==='All'||(x.n.category||x.n.topic)===S.cat);
 return `<div class="eyebrow">Stay interview-ready</div><h1>Business news, with context.</h1><p class="sub">Tap a picture for a quick summary.</p>
 ${cats.length>1?`<div class="chips" style="margin-top:18px">${cats.map(c=>`<button class="chip${c===S.cat?' on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:'<div style="height:18px"></div>'}
 ${S.failed.news?empty('News is unavailable right now.',1):!f.length?empty('No news yet.'):''}
 ${f.map(({n,i})=>{const cat=n.category||n.topic,sm=newsSummary(n);
  return `<div class="card">${thumb(n,i,1)}${cat?`<span class="tag">${esc(cat)}</span>`:''}<h3 style="margin-top:10px">${esc(n.title)}</h3>${sm?`<p class="sum clamp">${esc(sm)}</p>`:''}<p class="meta" style="margin-top:10px">${esc(n.source||'')}${n.source?' · ':''}${ago(n.date||n.published||n.pubDate)}</p></div>`}).join('')}`;
}

function vSaved(){
 const f=S.jobs.filter(j=>S.saved.includes(j.id));
 return `<div class="eyebrow">Your shortlist</div><h1>Saved jobs</h1><p class="sub">Keep promising roles within reach while you compare options.</p><div style="height:18px"></div>
 ${f.length?f.map(jobCard).join(''):`<div class="card empty">${ic.saved}<b>Your shortlist starts here</b>Save jobs you want to revisit.<br><button class="btn pri" data-go="jobs">Explore jobs</button></div>`}`;
}

function render(){
 const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;
 $('av').innerHTML=USER.name?esc(initials(USER.name)):ic.user;
 $('nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===S.tab?'on':''}" data-go="${k}">${ic[k]}${l}</button>`).join('');
 $('app').innerHTML=!S.ready?empty('Loading…'):({home:vHome,jobs:vJobs,updates:vUpdates,news:vNews,saved:vSaved})[S.tab]();
 if(id&&$(id)){$(id).focus();try{$(id).setSelectionRange(pos,pos)}catch(e){}}
}
function go(t,focus){S.tab=t;S.limit=30;closePop();window.scrollTo(0,0);render();if(focus&&$('q'))$('q').focus()}

function closePop(){$('pop').classList.remove('show');$('pop').dataset.k=''}
function togglePop(k){
 const p=$('pop');if(p.dataset.k===k)return closePop();
 const n=S.notices[0];
 p.innerHTML=k==='bell'?(n?`<div class="row"><h3 class="grow">Notifications</h3>${tagHtml(n)}</div><p style="margin:10px 0">${esc(n.title)}</p><button class="link" data-go="updates">View campus updates →</button>`:`<h3>Notifications</h3><p class="sub" style="margin-top:8px">You're all caught up.</p>`):`<h3>Your profile</h3><label class="field" style="margin:12px 0"><input id="nm" value="${esc(USER.name)}" maxlength="40" placeholder="Your name" autocomplete="name"></label><button class="btn pri" data-savename="1">Save name</button>`;
 p.dataset.k=k;p.classList.add('show');
}

function openSheet(i){
 const n=S.news[i];if(!n)return;const sm=newsSummary(n),url=safeUrl(n.url),cat=n.category||n.topic;
 $('sheet').innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-label="News summary"><div class="top"><span class="meta">${esc(n.source||'')}${n.source?' · ':''}${ago(n.date||n.published||n.pubDate)}</span><button class="icon" data-close="1" aria-label="Close">${ic.x}</button></div>
 ${thumb(n,i,0)}${cat?`<span class="tag">${esc(cat)}</span>`:''}<h3 style="font-size:20px;margin-top:10px">${esc(n.title)}</h3>
 <p>${sm?esc(sm):'This story has no summary in the feed. Open the full article to read it.'}</p>${url?`<a class="btn pri" href="${esc(url)}" target="_blank" rel="noopener">Read full article</a>`:''}</div>`;
 $('sheet').classList.add('show');document.body.style.overflow='hidden';
}
function closeSheet(){$('sheet').classList.remove('show');document.body.style.overflow=''}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-pop],[data-save],[data-share],[data-notice],[data-news],[data-cat],[data-more],[data-close],[data-install],[data-hide],[data-savename]');
 if(e.target===$('sheet'))return closeSheet();
 if(!t){if(!e.target.closest('#pop'))closePop();return}
 const d=t.dataset;
 if(d.go){closeSheet();return go(d.go,d.focus)}
 if(d.pop)return togglePop(d.pop);
 if(d.save){S.saved=S.saved.includes(d.save)?S.saved.filter(x=>x!==d.save):[...S.saved,d.save];save('ph_saved',S.saved);return render()}
 if(d.share){const j=S.jobs.find(x=>x.id===d.share);if(!j)return;const u=safeUrl(j.url);
  window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(`Check out this opening: ${j.title} at ${j.company}.${u?' Apply here: '+u:''}`),'_blank');return}
 if(d.notice){S.open[d.notice]=!S.open[d.notice];return render()}
 if(d.news)return openSheet(+d.news);
 if(d.cat){S.cat=d.cat;return render()}
 if(d.more){S.limit+=30;return render()}
 if(d.close)return closeSheet();
 if(d.install&&dp){dp.prompt();dp=null;return render()}
 if(d.hide){S.hideInstall=true;return render()}
 if(d.savename){const v=$('nm').value.trim();if(v){USER.name=v;save('ph_user',{name:v});closePop();render()}return}
});
document.addEventListener('input',e=>{
 const id=e.target.id;if(!['q','fs','fc'].includes(id))return;
 if(id==='q')S.q=e.target.value;if(id==='fs')S.sector=e.target.value;if(id==='fc')S.company=e.target.value;
 S.limit=30;render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();closePop()}});
document.addEventListener('error',e=>{if(e.target.tagName==='IMG')e.target.remove()},true);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if(S.tab==='home')render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
render();init();
</script>
</body>
</html>
